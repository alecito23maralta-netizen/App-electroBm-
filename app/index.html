<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Electrodomésticos BM — Panel interno</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BM Panel">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login-screen" id="login-screen">
    <div class="login-card login-card-wide">
      <div class="login-welcome">
        <div class="login-perrito">
          <svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="70" cy="142" rx="34" ry="6" fill="#000" opacity="0.18"/>
            <line x1="70" y1="9" x2="70" y2="24" stroke="#00b384" stroke-width="4" stroke-linecap="round"/>
            <circle cx="70" cy="7" r="6.5" fill="#00e5a0"/>
            <rect x="26" y="78" width="14" height="34" rx="7" fill="#00b384"/>
            <rect x="34" y="66" width="72" height="60" rx="24" fill="#00e5a0"/>
            <circle cx="70" cy="98" r="13" fill="#05130f"/>
            <text x="70" y="102.3" text-anchor="middle" font-size="11" font-weight="800" fill="#00e5a0" font-family="Arial, sans-serif">BM</text>
            <rect x="46" y="122" width="14" height="16" rx="7" fill="#00b384"/>
            <rect x="80" y="122" width="14" height="16" rx="7" fill="#00b384"/>
            <rect x="30" y="22" width="80" height="54" rx="26" fill="#0d0f14" stroke="#00e5a0" stroke-width="3"/>
            <circle cx="54" cy="49" r="9" fill="#00e5a0"/>
            <circle cx="86" cy="49" r="9" fill="#00e5a0"/>
            <circle cx="57" cy="46" r="2.6" fill="#eafff6"/>
            <circle cx="89" cy="46" r="2.6" fill="#eafff6"/>
            <path d="M56 62 Q70 70 84 62" stroke="#00e5a0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            <rect x="97" y="53" width="14" height="32" rx="7" fill="#00b384" transform="rotate(-30 104 69)"/>
            <circle cx="115" cy="45" r="9" fill="#00b384"/>
            <rect x="106" y="12" width="30" height="21" rx="9" fill="#fff"/>
            <polygon points="112,31 121,31 112,40" fill="#fff"/>
            <circle cx="115" cy="22.5" r="2" fill="#00b384"/>
            <circle cx="121" cy="22.5" r="2" fill="#00b384"/>
            <circle cx="127" cy="22.5" r="2" fill="#00b384"/>
          </svg>
          <div class="login-perrito-globo">¡Hola! Me llamo BAM 🤖</div>
        </div>
        <div class="login-logo-texto">
          <span class="l1">ELECTRODOMÉSTICOS</span>
          <span class="l2">BM</span>
        </div>
        <p class="login-slogan">Confort para tu hogar</p>
      </div>
      <div class="login-form-col">
        <div class="login-brand">
          <div>
            <h1>Electrodomésticos BM</h1>
            <p>Panel interno de trabajo</p>
          </div>
        </div>
        <form class="login-form" id="login-form">
          <div class="login-error" id="login-error"></div>
          <div class="field">
            <label for="login-usuario">Usuario</label>
            <input type="text" id="login-usuario" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit">Ingresar →</button>
        </form>
        <a href="catalogo.html" class="login-catalogo-link">🖼️ Ver catálogo de productos</a>
      </div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <button class="icon-btn menu-toggle" id="menu-toggle" title="Menú">☰</button>
        <div class="mark">BM</div>
        <div>
          <h1>Electrodomésticos BM</h1>
          <span id="topbar-sub">Bolivia</span>
        </div>
      </div>
      <div class="who">
        <span class="role-chip" id="role-chip">—</span>
        <button class="icon-btn" id="logout-btn" title="Salir">⎋</button>
      </div>
    </header>
    <div class="nav-backdrop" id="nav-backdrop"></div>

    <div id="alerta-pendientes"></div>
    <div id="notificaciones-vendedor"></div>

    <main class="view" id="view-cotizaciones"></main>
    <main class="view" id="view-ventas" hidden></main>
    <main class="view" id="view-catalogo" hidden></main>
    <main class="view" id="view-promos" hidden></main>
    <main class="view" id="view-chat" hidden></main>
    <main class="view" id="view-comprobantes" hidden></main>
    <main class="view" id="view-inventario" hidden></main>
    <main class="view" id="view-caja" hidden></main>
    <main class="view" id="view-usuarios" hidden></main>
    <main class="view" id="view-garantias" hidden></main>

    <nav class="bottom-nav" id="bottom-nav">
      <div class="nav-group" data-group="ventas">
        <button class="nav-group-header" data-group-toggle="ventas">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.6 12.6a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L23 7H6"/></svg></span>
          <span class="nav-group-label">Ventas</span>
          <span class="chevron">▸</span>
        </button>
        <div class="nav-group-items">
          <button class="nav-item" data-view="cotizaciones"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg></span>Cotiz.</button>
          <button class="nav-item" data-view="ventas"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.6 12.6a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L23 7H6"/></svg></span>Ventas</button>
          <button class="nav-item" data-view="catalogo"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></span>Catálogo</button>
          <button class="nav-item" data-view="promos"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8Z"/><path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8Z"/></svg></span>Promos</button>
        </div>
      </div>

      <div class="nav-group" data-group="calculadoras">
        <button class="nav-group-header" data-group-toggle="calculadoras">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="8" y2="19"/><line x1="12" y1="19" x2="12" y2="19"/></svg></span>
          <span class="nav-group-label">Calculadoras</span>
          <span class="chevron">▸</span>
        </button>
        <div class="nav-group-items">
          <button class="nav-item" data-calc="calefaccion"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>Calefacción</button>
          <button class="nav-item" data-calc="agua"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69s-6 7.13-6 10.87a6 6 0 0 0 12 0c0-3.74-6-10.87-6-10.87Z"/></svg></span>Agua caliente</button>
          <button class="nav-item" data-calc="aires"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93 4.93 19.07"/></svg></span>Aire acondicionado</button>
        </div>
      </div>

      <button class="nav-item nav-item-suelto" data-view="chat"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>Chat<span class="nav-badge" id="chat-badge" hidden>0</span></button>
      <button class="nav-item nav-item-suelto" data-view="comprobantes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14h6M9 18h3M9 3v4a1 1 0 0 1-1 1H4"/><path d="M18 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7Z"/><path d="M13 3v4a1 1 0 0 0 1 1h4"/></svg></span>Comprobantes</button>

      <div class="nav-group" data-group="gestion" id="nav-group-gestion">
        <button class="nav-group-header" data-group-toggle="gestion">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span>
          <span class="nav-group-label">Gestión</span>
          <span class="chevron">▸</span>
        </button>
        <div class="nav-group-items">
          <button class="nav-item" data-view="inventario" id="nav-inventario"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span>Invent.</button>
          <button class="nav-item" data-importar="productos" id="nav-importar-productos"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></span>Importar Excel</button>
          <button class="nav-item" data-view="caja" id="nav-caja"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/><path d="M18 12a2 2 0 0 1 0-4h4v4Z"/></svg></span>Caja</button>
          <button class="nav-item" data-view="usuarios" id="nav-usuarios"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>Usuarios</button>
          <button class="nav-item" data-view="garantias" id="nav-garantias"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></span>Garantías</button>
        </div>
      </div>
    </nav>
  </div>

  <!-- ============ MODAL GENÉRICO ============ -->
  <div class="overlay" id="modal-overlay">
    <div class="sheet" id="modal-sheet"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Puente nativo Capacitor: solo se activa dentro de la app instalada (APK). En el navegador no hace nada. -->
  <script src="vendor/capacitor/capacitor-core.js?v=9"></script>
  <script src="vendor/capacitor/synapse.js?v=9"></script>
  <script src="vendor/capacitor/bridge-alias.js?v=9"></script>
  <script src="vendor/capacitor/filesystem-plugin.js?v=9"></script>
  <script src="vendor/capacitor/share-plugin.js?v=9"></script>
  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('No se pudo registrar el service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
