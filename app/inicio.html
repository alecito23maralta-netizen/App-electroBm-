<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio — Electrodomésticos BM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1D29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BM App">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#1A1D29; --bg-soft:#232735; --line:#2E3344;
    --text:#F4F2ED; --text-dim:#9499AC;
    --c-mercados:#FF6B35; --c-cotiza:#A8E063; --c-caja:#FFD23F;
    --c-productos:#9B7EDE; --c-ventas:#4FC3E0; --c-personal:#F472B6;
    --danger:#FF6B6B; --ok:#A8E063;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;}
  .screen{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:28px 20px 32px;}

  header{margin-bottom:22px;}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--c-cotiza);box-shadow:0 0 0 3px rgba(168,224,99,.18);}
  h1{font-family:'Archivo Black',sans-serif;font-size:32px;line-height:1.05;letter-spacing:-.01em;}
  h1 span{display:block;color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:600;font-size:14px;letter-spacing:0;margin-top:6px;}

  .role-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(244,114,182,.14);border:1px solid var(--c-personal);border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--c-personal);margin-top:8px;}

  .grid{display:flex;flex-direction:column;gap:12px;flex:1;}

  .card{position:relative;display:flex;align-items:center;gap:16px;background:var(--bg-soft);border:1px solid var(--line);border-radius:18px;padding:18px;text-decoration:none;color:var(--text);overflow:hidden;cursor:pointer;transition:transform .15s ease;}
  .card:active{transform:scale(.97);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);}
  .card::after{content:"";position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);}
  .card[data-mod="mercados"]{--accent:var(--c-mercados);}
  .card[data-mod="cotiza"]{--accent:var(--c-cotiza);}
  .card[data-mod="caja"]{--accent:var(--c-caja);}
  .card[data-mod="productos"]{--accent:var(--c-productos);}
  .card[data-mod="ventas"]{--accent:var(--c-ventas);}
  .card[data-mod="personal"]{--accent:var(--c-personal);}

  .card-icon{flex-shrink:0;width:50px;height:50px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;}
  .card-icon svg{width:24px;height:24px;stroke:#14151c;}
  .card-body{flex:1;min-width:0;}
  .card-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
  .card-title{font-family:'Archivo Black',sans-serif;font-size:18px;line-height:1.15;margin-bottom:2px;}
  .card-sub{font-size:12.5px;color:var(--text-dim);}
  .card-arrow{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-right:6px;}
  .card-arrow svg{width:13px;height:13px;stroke:var(--text-dim);}

  /* Modal Personal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,11,16,.78);z-index:60;align-items:flex-end;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal-sheet{background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-width:480px;width:100%;padding:20px 20px 36px;max-height:90vh;overflow-y:auto;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-title{font-family:'Archivo Black',sans-serif;font-size:18px;}
  .modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:14px;}

  .field-label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
  input[type="text"],input[type="email"],input[type="password"]{width:100%;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;margin-bottom:12px;}
  .btn-crear{width:100%;background:var(--c-personal);color:#14151c;border:none;border-radius:14px;padding:15px;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px;}
  .btn-crear:disabled{opacity:.5;}

  .usuarios-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .usuario-row{display:flex;align-items:center;gap:10px;background:var(--bg-soft);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .usuario-info{flex:1;}
  .usuario-email{font-size:13.5px;font-weight:700;}
  .usuario-meta{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .btn-delete{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--danger);font-size:14px;cursor:pointer;}

  .msg-box{border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:12px;display:none;}
  .msg-box.show{display:block;}
  .msg-box.ok{background:rgba(168,224,99,.14);border:1px solid var(--ok);color:var(--ok);}
  .msg-box.err{background:rgba(255,107,107,.14);border:1px solid var(--danger);color:var(--danger);}

  footer{margin-top:20px;text-align:center;font-size:12px;color:var(--text-dim);}
  :focus-visible{outline:2px solid var(--c-cotiza);outline-offset:2px;}

  /* --- PWA: banner de sin conexión --- */
  .pwa-offline-banner{display:none;background:var(--danger,#FF6B6B);color:#14151c;text-align:center;font-size:12.5px;font-weight:700;padding:9px 14px;font-family:'Inter',sans-serif;}
  .pwa-offline-banner.show{display:block;}
</style>
</head>
<body>
<div id="pwa-offline-banner" class="pwa-offline-banner">📡 Sin conexión — los datos podrían no actualizarse</div>

<div class="screen">
  <header>
    <div class="eyebrow"><span class="dot"></span><span id="fecha-hoy">Cargando...</span></div>
    <h1>Trabajo de<br>campo<span id="bienvenida">Elige un módulo para empezar</span></h1>
    <div id="role-badge" style="display:none;" class="role-badge">⚙️ Administrador</div>
  </header>

  <div class="grid" id="grid-modulos"></div>

  <footer>
    Línea Blanca · Línea Gas — Bolivia<br>
    <span id="usuario-actual" style="opacity:.7;"></span>
    <a href="#" onclick="cerrarSesion();return false;" style="color:var(--c-mercados);text-decoration:none;margin-left:8px;">Cerrar sesión</a>
  </footer>
</div>

<!-- Modal Personal -->
<div class="modal-overlay" id="modal-personal">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">👤 Personal</div>
      <button class="modal-close" onclick="cerrarPersonal()">✕</button>
    </div>

    <div class="msg-box" id="personal-msg"></div>

    <div class="field-label">Nuevo usuario</div>
    <input type="email" id="nuevo-email" placeholder="correo@electrodomesticosbm.com">
    <input type="password" id="nuevo-password" placeholder="Contraseña (mín. 8 caracteres)">
    <button class="btn-crear" id="btn-crear-usuario" onclick="crearUsuario()">Crear usuario</button>

    <div class="field-label" style="margin-top:20px;">Usuarios registrados</div>
    <div class="usuarios-list" id="lista-usuarios"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://omxzisjowcmkvqpviuat.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OGujpzzM0UVDAsgGRplMwA_u1oURINP';
// Ya no se usa para decidir permisos (eso ahora lo hace profiles.role
// en Supabase, ver supabase/migrations). Se deja como referencia: es
// el email que el trigger de la base de datos asigna como admin.
const ADMIN_EMAIL = 'alejandro23mtz@electrodomesticosbm.com';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Cliente aparte, sin sesión persistida, solo para crear usuarios nuevos
// (auth.signUp). Usar el mismo supabaseClient de arriba reemplazaría la
// sesión del admin logueado por la del usuario recién creado — un gotcha
// conocido de supabase-js. Con este cliente aislado eso no pasa.
const supabaseAdminClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false }
});

async function requireSession(){
  const { data, error } = await supabaseClient.auth.getSession();
  if(error || !data.session){ window.location.href = 'login.html'; return null; }
  return data.session;
}
async function esAdmin(){
  const { data } = await supabaseClient.auth.getSession();
  if(!data.session) return false;
  const { data: perfil, error } = await supabaseClient
    .from('profiles')
    .select('role')
    .eq('id', data.session.user.id)
    .maybeSingle();
  if(error){ console.error('Error verificando rol:', error.message); return false; }
  return perfil?.role === 'admin';
}
async function cerrarSesion(){
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
}
async function mostrarUsuarioEnElemento(elementId){
  const { data } = await supabaseClient.auth.getSession();
  const el = document.getElementById(elementId);
  if(el && data.session) el.textContent = data.session.user.email;
}
</script>

<script>
// Módulos disponibles para cada rol
const MODULOS_ADMIN = [
  { mod:'mercados', num:'01', titulo:'Inf. de Mercado', sub:'Relevamiento y datos en terreno', href:'mercados.html', svg:'<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>' },
  { mod:'cotiza',   num:'02', titulo:'Cotizaciones',    sub:'Generar y enviar cotizaciones',   href:'cotizaciones.html', svg:'<path d="M9 2h6l1 4H8l1-4z"/><path d="M5 6h14l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6z"/><path d="M9 11h6M9 15h6"/>' },
  { mod:'caja',     num:'03', titulo:'Caja',            sub:'Ingresos, egresos y arqueo',      href:'caja.html', svg:'<rect x="2" y="7" width="20" height="13" rx="2"/><path d="M2 11h20"/><circle cx="12" cy="15" r="2"/>' },
  { mod:'productos',num:'04', titulo:'Productos nuevos',sub:'Catálogo y altas de producto',   href:'mercados.html', svg:'<path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M3 7l9 5 9-5M12 22V12"/>' },
  { mod:'ventas',   num:'05', titulo:'Ventas',          sub:'Registro e historial de ventas', href:'ventas.html', svg:'<path d="M16 3h5v5"/><path d="M21 3L13 11l-4-4-6 6"/><path d="M3 21h18"/>' },
  { mod:'personal', num:'06', titulo:'Personal',        sub:'Gestión de usuarios de la app',  href:'#', svg:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>' },
];

const MODULOS_VENDEDOR = ['mercados','cotiza','ventas'];

function cardHTML(m, num){
  return `
    <a class="card" data-mod="${m.mod}" href="${m.href}" onclick="${m.mod==='personal'?'abrirPersonal();return false;':''}">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.svg}</svg>
      </div>
      <div class="card-body">
        <div class="card-tag">Módulo ${num}</div>
        <div class="card-title">${m.titulo}</div>
        <div class="card-sub">${m.sub}</div>
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </a>`;
}

(async () => {
  const session = await requireSession();
  if(!session) return;

  mostrarUsuarioEnElemento('usuario-actual');

  const admin = await esAdmin();
  const modulos = admin ? MODULOS_ADMIN : MODULOS_ADMIN.filter(m => MODULOS_VENDEDOR.includes(m.mod));

  if(admin){
    document.getElementById('role-badge').style.display = 'inline-flex';
    document.getElementById('bienvenida').textContent = 'Bienvenido, administrador';
  }

  const grid = document.getElementById('grid-modulos');
  modulos.forEach((m, i) => {
    grid.insertAdjacentHTML('beforeend', cardHTML(m, String(i+1).padStart(2,'0')));
  });
})();

// Fecha
const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const hoy=new Date();
document.getElementById('fecha-hoy').textContent=dias[hoy.getDay()]+', '+hoy.getDate()+' de '+meses[hoy.getMonth()];

// ---------- Personal ----------
function abrirPersonal(){
  document.getElementById('modal-personal').classList.add('show');
  cargarListaUsuarios();
}
function cerrarPersonal(){
  document.getElementById('modal-personal').classList.remove('show');
}

function mostrarMsg(texto, tipo){
  const el = document.getElementById('personal-msg');
  el.textContent = texto;
  el.className = 'msg-box show ' + tipo;
  setTimeout(() => el.classList.remove('show'), 3500);
}

async function crearUsuario(){
  const email = document.getElementById('nuevo-email').value.trim();
  const pass  = document.getElementById('nuevo-password').value;
  const btn   = document.getElementById('btn-crear-usuario');

  if(!email || !pass){ mostrarMsg('Completa correo y contraseña.','err'); return; }
  if(pass.length < 8){ mostrarMsg('La contraseña debe tener al menos 8 caracteres.','err'); return; }

  btn.disabled = true;
  btn.textContent = 'Creando...';

  // Se crea con supabaseAdminClient (un cliente Supabase aparte, sin sesión
  // persistida) para no reemplazar la sesión del admin logueado. El anon
  // key no puede usar auth.admin.createUser (requiere la service_role key,
  // que nunca debe vivir en el navegador), así que se usa signUp: crea la
  // cuenta real en Supabase Auth y el trigger de la base de datos le asigna
  // el rol 'vendedor' automáticamente (ver supabase/migrations).
  const { error } = await supabaseAdminClient.auth.signUp({ email, password: pass });

  btn.disabled = false;
  btn.textContent = 'Crear usuario';

  if(error){ mostrarMsg('Error: ' + error.message, 'err'); return; }

  mostrarMsg('Usuario creado ✓ (según la configuración del proyecto, puede necesitar confirmar su correo antes de poder iniciar sesión)', 'ok');
  document.getElementById('nuevo-email').value = '';
  document.getElementById('nuevo-password').value = '';
  // El perfil lo crea un trigger en Supabase casi al instante; esperamos
  // un segundo antes de refrescar para darle tiempo a propagarse.
  setTimeout(cargarListaUsuarios, 1000);
}

async function cargarListaUsuarios(){
  const cont = document.getElementById('lista-usuarios');
  cont.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Cargando...</div>';

  const { data: sesion } = await supabaseClient.auth.getSession();
  const miId = sesion.session?.user?.id;

  // Lista real de usuarios y roles, desde la tabla profiles (requiere la
  // migración de supabase/migrations — un admin ve todas las filas gracias
  // a la policy profiles_select).
  const { data: usuarios, error } = await supabaseClient
    .from('profiles')
    .select('id, email, role, created_at')
    .order('created_at', { ascending: true });

  if(error){
    cont.innerHTML = '<div style="color:var(--danger);font-size:13px;padding:8px 0;">Error cargando usuarios: ' + error.message + '</div>';
    return;
  }

  if(!usuarios || usuarios.length === 0){
    cont.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Todavía no hay usuarios.</div>';
    return;
  }

  cont.innerHTML = usuarios.map(u => `
    <div class="usuario-row">
      <div class="usuario-info">
        <div class="usuario-email">${u.email}</div>
        <div class="usuario-meta">${u.role === 'admin' ? '⚙️ Administrador' : '🧑‍💼 Vendedor'} · desde ${new Date(u.created_at).toLocaleDateString('es-BO')}</div>
      </div>
      ${u.id === miId ? '' : `
        <button class="btn-delete" style="width:auto;border-radius:10px;padding:6px 10px;font-size:11.5px;color:var(--text);white-space:nowrap;"
          onclick="cambiarRol('${u.id}','${u.role === 'admin' ? 'vendedor' : 'admin'}')">
          Hacer ${u.role === 'admin' ? 'vendedor' : 'admin'}
        </button>`}
    </div>
  `).join('');
}

async function cambiarRol(id, nuevoRol){
  if(!confirm('¿Cambiar este usuario a "' + nuevoRol + '"?')) return;
  const { error } = await supabaseClient.from('profiles').update({ role: nuevoRol }).eq('id', id);
  if(error){ mostrarMsg('Error: ' + error.message, 'err'); return; }
  mostrarMsg('Rol actualizado ✓', 'ok');
  cargarListaUsuarios();
}
</script>

<script>
(function(){
  var banner = document.getElementById('pwa-offline-banner');
  function actualizarEstadoConexion(){
    if(!banner) return;
    banner.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', actualizarEstadoConexion);
  window.addEventListener('offline', actualizarEstadoConexion);
  actualizarEstadoConexion();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){
      console.warn('No se pudo registrar el service worker:', err);
    });
  });
}
</script>
</body>
</html>
