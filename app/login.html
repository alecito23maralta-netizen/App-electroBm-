<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Electrodomésticos BM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1D29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BM App">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1A1D29;
    --bg-soft: #232735;
    --line: #2E3344;
    --text: #F4F2ED;
    --text-dim: #9499AC;
    --accent: #FF6B35;
    --danger: #FF6B6B;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  .screen{
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 24px;
    gap: 28px;
  }

  .brand{
    text-align: center;
  }

  .brand .logo{
    font-size: 36px;
    margin-bottom: 10px;
  }

  .brand h1{
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    line-height: 1.2;
  }

  .brand .sub{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .field-label{
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  input[type="email"], input[type="password"]{
    width: 100%;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
  }

  .field{ margin-bottom: 14px; }

  .btn-login{
    width: 100%;
    background: var(--accent);
    color: #14151c;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .btn-login:active{ transform: scale(0.98); }
  .btn-login:disabled{ opacity: 0.5; }

  .error-msg{
    background: rgba(255,107,107,0.14);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 13px;
    display:none;
    margin-bottom: 14px;
  }

  .error-msg.show{ display:block; }

  .footer-note{
    text-align:center;
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* --- PWA: banner de sin conexión --- */
  .pwa-offline-banner{display:none;background:var(--danger,#FF6B6B);color:#14151c;text-align:center;font-size:12.5px;font-weight:700;padding:9px 14px;font-family:'Inter',sans-serif;}
  .pwa-offline-banner.show{display:block;}
</style>
</head>
<body>
<div id="pwa-offline-banner" class="pwa-offline-banner">📡 Sin conexión — los datos podrían no actualizarse</div>

<div class="screen">

  <div class="brand">
    <div class="logo">🔌</div>
    <h1>ELECTRODOMÉSTICOS BM</h1>
    <div class="sub">Inicia sesión para continuar</div>
  </div>

  <div>
    <div class="error-msg" id="error-msg"></div>

    <div class="field">
      <div class="field-label">Correo</div>
      <input type="email" id="login-email" placeholder="tucorreo@ejemplo.com" autocomplete="username">
    </div>

    <div class="field">
      <div class="field-label">Contraseña</div>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btn-login" onclick="iniciarSesion()">Iniciar sesión</button>
  </div>

  <div class="footer-note">
    Las cuentas son creadas por el administrador.<br>
    Si no tienes acceso, contacta a tu supervisor.
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://omxzisjowcmkvqpviuat.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OGujpzzM0UVDAsgGRplMwA_u1oURINP';
const ADMIN_EMAIL = 'alejandro23mtz@electrodomesticosbm.com';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function requireSession(){
  const { data, error } = await supabaseClient.auth.getSession();
  if(error || !data.session){ window.location.href = 'login.html'; return null; }
  return data.session;
}

async function esAdmin(){
  const { data } = await supabaseClient.auth.getSession();
  return data.session && data.session.user.email === ADMIN_EMAIL;
}

async function cerrarSesion(){
  await supabaseClient.auth.signOut();
  window.location.href = 'login.html';
}

async function mostrarUsuarioEnElemento(elementId){
  const { data } = await supabaseClient.auth.getSession();
  const el = document.getElementById(elementId);
  if(el && data.session) el.textContent = data.session.user.email;
}

</script>
<script>
  // Si ya hay una sesión activa, ir directo al inicio
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if(data.session){
      window.location.href = 'inicio.html';
    }
  })();

  async function iniciarSesion(){
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorBox = document.getElementById('error-msg');
    const btn = document.getElementById('btn-login');

    errorBox.classList.remove('show');

    if(!email || !password){
      errorBox.textContent = 'Completa correo y contraseña.';
      errorBox.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';

    if(error){
      errorBox.textContent = 'Correo o contraseña incorrectos.';
      errorBox.classList.add('show');
      return;
    }

    window.location.href = 'inicio.html';
  }

  // Permitir enviar con Enter
  document.getElementById('login-password').addEventListener('keydown', e => {
    if(e.key === 'Enter') iniciarSesion();
  });
</script>


<script>
(function(){
  var banner = document.getElementById('pwa-offline-banner');
  function actualizarEstadoConexion(){
    if(!banner) return;
    banner.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', actualizarEstadoConexion);
  window.addEventListener('offline', actualizarEstadoConexion);
  actualizarEstadoConexion();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){
      console.warn('No se pudo registrar el service worker:', err);
    });
  });
}
</script>
</body>
</html>
