<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — Electrodomésticos BM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BM Panel">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0d0f14;
    --surface: #161922;
    --border: #2a2f3c;
    --text: #edeff5;
    --text-dim: #98a0b3;
    --accent: #00e5a0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  .screen{
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 32px 24px;
    gap: 18px;
  }

  .icon{
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.3;
  }

  p{
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    max-width: 320px;
  }

  .btn-retry{
    margin-top: 6px;
    background: linear-gradient(135deg, var(--accent), #00b384);
    color: #05130f;
    border: none;
    border-radius: 12px;
    padding: 14px 26px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }

  .btn-retry:active{ transform: scale(0.98); }
</style>
</head>
<body>

<div class="screen">
  <div class="icon">📡</div>
  <h1>Sin conexión</h1>
  <p>No pudimos cargar esta pantalla porque no hay internet. Revisá tu conexión e intentá de nuevo — tus datos siguen seguros en el servidor.</p>
  <button class="btn-retry" onclick="location.reload()">Reintentar</button>
</div>

</body>
</html>
